/**:
  ros__parameters:

    # The Hugging Face repo id to use.
    # Only used as a fallback when model_dir holds no local weights.
    # Qwen/Qwen-Image-2.1 (Qwen Research License)
    repo_id: "Qwen/Qwen-Image-2.1"

    # Directory with the local weights (model_index.json) or the download cache.
    model_dir: "./models"

    # The torch device to use (e.g., "cuda:0" or "cpu")
    device: "cuda:0"

    # --- Initial Prompt ---

    # An initial prompt to generate an image at startup.
    # Supports plain text OR JSON: {"content": "...", "image_url": "..."}
    prompt: "A robot face close up which has a small daisy flower in its mouth on the left side, cinematic lighting, 8k resolution"

    # --- Dynamic Parameters (Adjustable via RQT) ---

    # If true, keeps the model in memory between prompts (faster)
    keep_loaded: true

    # If true, the model is loaded at startup instead of on the first prompt.
    # Together with keep_loaded: true the model is resident and stays resident.
    preload: false

    # If true, uses model CPU offloading to save VRAM.
    # On a 24 GB card this is required: text encoder (17.5 GB) + DiT (14.2 GB) do not
    # fit side by side, so cpu_offload=false will run into CUDA OOM.
    cpu_offload: true

    # More aggressive offloading (slower) for very tight VRAM.
    sequential_offload: false

    # Tiled VAE decode. Keeps the decode memory peak flat, matters from ~1536 px on.
    vae_tiling: true

    # Edge length (px) the condition/reference image is resized to before it is encoded by the
    # Qwen3-VL text encoder and the VAE (16x downsampling -> output_resolution/16 latent tokens).
    # 0 = auto = max(width, height) -- keep this at auto! A value smaller than the output size
    # breaks conditioning: measured at 2048x2048 with output_resolution 1024, the model ignored
    # both prompt and reference image (two seeds, same result).
    output_resolution: 0

    # Number of denoising steps (Qwen-Image 2.1 is sampled without guidance, 40 is the card default)
    num_inference_steps: 40

    # Classifier-free guidance (maps to true_cfg_scale, default 1.0 = off).
    # Values > 1 only take effect together with negative_prompt.
    guidance_scale: 1.0

    # Negative prompt, required for guidance_scale > 1
    negative_prompt: ""

    # Number of images to generate per prompt request
    num_images_per_prompt: 1

    # The frame_id for the generated image messages
    frame_id: "q21img"

    # --- Output & Control ---

    # Path/URL to an input image to condition the generation (leave empty for text-to-image)
    input_image: ""

    # If true, the node will exit after generating the first image
    once: false

    # Path for saving output images (this is also the code default).
    # A path ending in "auto" gets unique filenames q21img_<counter>_<random>.png;
    # the directory is created if missing. Relative paths use the node's working directory.
    # Leave empty to disable saving (images are then only published on /generated_image).
    image_path: "generated_images/auto"

    # Seed for the random number generator. Use -1 for a random seed on each run
    seed: -1

    # Starting value for the autogenerated image filename counter
    image_counter_start: 9000

    # Dimensions of the generated image.
    # 1024x1024 is the fast path. Native training resolutions (2048 px class) are:
    # 1:1 2048x2048 | 4:3 2400x1792 | 3:4 1792x2400 | 3:2 2528x1696
    # 2:3 1696x2528 | 16:9 2752x1536 | 9:16 1536x2752
    height: 1280
    width: 1280
